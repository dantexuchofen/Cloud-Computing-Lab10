services:

  streamlit:
    image: python:3.11-slim
    container_name: streamlit_app

    working_dir: /app

    ports:
      - "8501:8501"

    volumes:
      - ./streamlit:/app

    depends_on:
      - mongo

    command: >
      bash -c "
      pip install -r requirements.txt &&
      streamlit run app.py --server.address=0.0.0.0
      "

  mongo:
    image: mongo:7
    container_name: mongo_db

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: